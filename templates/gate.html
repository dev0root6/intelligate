{% extends "base.html" %}
{% block title %}Metro Gate - IntelliGate AFC{% endblock %}
{% block content %}
<div class="gate-kiosk">
  <!-- Status result — big, kiosk-readable -->
  <div id="gateResult" class="gate-result"></div>
  <div id="gateStatus" class="gate-status-msg"></div>

  <!-- Camera — secondary, small -->
  <div class="gate-video-wrap mb-3">
    <video id="gateVideo" autoplay playsinline></video>
    <canvas id="gateCanvas" style="display:none;"></canvas>
    <div class="gate-overlay">
      <div class="gate-scan-frame"></div>
    </div>
  </div>

  <div class="text-center mb-4">
    <button id="gateStartBtn" class="btn-brand" onclick="startGateScan()">
      <i class="ph ph-video-camera"></i> Start Scanning
    </button>
    <button id="gateStopBtn" class="btn btn-danger-outline" onclick="stopGateScan()" disabled style="display:none;">
      <i class="ph ph-stop-circle"></i> Stop
    </button>
  </div>

  <!-- Backup: Booking Reference ID -->
  <div class="card-metro p-4 mt-3">
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="icon-circle icon-circle-blue" style="width:40px;height:40px;font-size:1.1rem;flex-shrink:0;">
        <i class="ph ph-key"></i>
      </div>
      <div>
        <h6 class="fw-bold mb-0">Backup Entry</h6>
        <small class="text-muted">Enter your Booking Reference ID if face scan isn't working</small>
      </div>
    </div>

    <form id="manualLookupForm" onsubmit="event.preventDefault(); handleManualLookup();" class="row g-2 align-items-center">
      <div class="col-sm-8">
        <input type="text" id="manualBookingIdInput" class="form-control text-uppercase fw-semibold"
               placeholder="e.g. MET562986" required style="letter-spacing:1px;">
      </div>
      <div class="col-sm-4">
        <button type="submit" id="manualLookupBtn" class="btn-brand w-100">
          <i class="ph ph-magnifying-glass"></i> Look Up
        </button>
      </div>
    </form>

    <div id="manualDetailsContainer" class="mt-3" style="display:none;"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/gate.js') }}"></script>
{% endblock %}
