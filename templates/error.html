{% extends "base.html" %}
{% block title %}Error {{ code }} - IntelliGate AFC{% endblock %}
{% block content %}
<div class="container text-center my-5">
  <div class="error-icon"><i class="ph ph-warning-circle"></i></div>
  <h1 class="fw-bold">{{ code }}</h1>
  <p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('home') }}" class="btn-brand mt-3"><i class="ph ph-house"></i> Back Home</a>
</div>
{% endblock %}
